# Tool configuration. One file, so every tool (and CI) reads the same rules.

[project]
name = "miniseal"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts a real server process (slower). Skip with: -m \"not integration\"",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused names, undefined names
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "S",       # bandit: security smells
    "SIM",     # simplifications
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point (S101); fixed test values aren't secrets (S105/S106);
# subprocess calls start our own server and CLI (S603).
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be call defaults (B008 doesn't know).
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Security"]
